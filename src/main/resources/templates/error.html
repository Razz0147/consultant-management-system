<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Error', ~{::div.error-container})}">
<body>
<div class="error-container">

    <div class="row justify-content-center my-5">
        <div class="col-md-6 text-center">
            <div class="content-card p-5">
                <i class="fa-solid fa-circle-exclamation text-danger fa-4x mb-3"></i>
                <h2 class="fw-bold text-dark mb-2" th:text="${status != null ? 'Error ' + status : 'Unexpected Error'}">Error</h2>
                <h5 class="text-secondary mb-3" th:text="${error != null ? error : 'Application Exception'}">An error occurred</h5>
                <p class="text-muted mb-4" th:text="${message != null ? message : 'Something went wrong while processing your request.'}"></p>
                
                <a th:href="@{/dashboard}" class="btn btn-primary px-4 me-2">
                    <i class="fa-solid fa-house me-1"></i> Go to Dashboard
                </a>
                <a th:href="@{/consultants}" class="btn btn-outline-secondary px-4">
                    <i class="fa-solid fa-users me-1"></i> View Consultants
                </a>
            </div>
        </div>
    </div>

</div>
</body>
</html>
