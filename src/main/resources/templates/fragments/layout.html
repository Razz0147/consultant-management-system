<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Consultant Management System'">Consultant Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS (with version cache busting) -->
    <link th:href="@{/css/style.css(v='2.2')}" rel="stylesheet">
</head>
<body>
    <!-- Background glows for glassmorphism -->
    <div class="bg-glow-container">
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
    </div>
    <div class="d-flex">
        <!-- Sidebar -->
        <aside class="sidebar d-flex flex-column">
            <div class="brand-title d-flex align-items-center gap-2">
                <i class="fa-solid fa-user-tie text-indigo me-1" style="color: #818cf8;"></i>
                <span>CMS Admin</span>
            </div>
            <nav class="nav flex-column mt-3">
                <a th:href="@{/dashboard}" class="nav-link" th:classappend="${activePage == 'dashboard'} ? 'active' : ''">
                    <i class="fa-solid fa-chart-pie"></i> Dashboard
                </a>
                <a th:href="@{/consultants}" class="nav-link" th:classappend="${activePage == 'consultants'} ? 'active' : ''">
                    <i class="fa-solid fa-users"></i> All Consultants
                </a>
                <!-- Show Add Consultant link for Administrator and Manager roles only -->
                <a th:if="${currentRole == 'Administrator' or currentRole == 'Manager'}" th:href="@{/consultants/add}" class="nav-link" th:classappend="${activePage == 'add-consultant'} ? 'active' : ''">
                    <i class="fa-solid fa-user-plus"></i> Add Consultant
                </a>
                <a th:href="@{/reports}" class="nav-link" th:classappend="${activePage == 'reports'} ? 'active' : ''">
                    <i class="fa-solid fa-chart-line"></i> Reports
                </a>
            </nav>
            <div class="mt-auto p-3 text-center border-top border-secondary opacity-75 small">
                <p class="mb-0 text-muted">Consultant System v2.0</p>
                <small class="text-secondary">Spring Boot & MySQL</small>
            </div>
        </aside>

        <!-- Main Workspace -->
        <div class="main-wrapper">
            <!-- Header Bar -->
            <header class="top-header d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-3">
                    <h4 class="mb-0 fw-bold text-dark" th:text="${title}">Dashboard</h4>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <!-- Excel & PDF Reports download -->
                    <a th:href="@{/consultants/export/excel}" class="btn btn-outline-success btn-sm me-1" title="Excel Report">
                        <i class="fa-solid fa-file-excel"></i> <span class="d-none d-md-inline">Excel</span>
                    </a>
                    <a th:href="@{/consultants/export/pdf}" class="btn btn-outline-danger btn-sm me-2" title="PDF Report">
                        <i class="fa-solid fa-file-pdf"></i> <span class="d-none d-md-inline">PDF</span>
                    </a>

                    <!-- Simulated Role Switcher -->
                    <div class="dropdown me-2">
                        <button class="btn btn-outline-primary btn-sm dropdown-toggle fw-bold" type="button" data-bs-toggle="dropdown">
                            <i class="fa-solid fa-user-shield me-1"></i> <span class="d-none d-sm-inline">Role: </span><span th:text="${currentRole}">Administrator</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                            <li><a class="dropdown-item fw-semibold" th:href="@{/switch-role(role='Administrator')}"><i class="fa-solid fa-user-gear me-2 text-indigo"></i>Administrator</a></li>
                            <li><a class="dropdown-item fw-semibold" th:href="@{/switch-role(role='Manager')}"><i class="fa-solid fa-user-pen me-2 text-success"></i>Manager</a></li>
                            <li><a class="dropdown-item fw-semibold" th:href="@{/switch-role(role='Viewer')}"><i class="fa-solid fa-user me-2 text-secondary"></i>Viewer</a></li>
                        </ul>
                    </div>

                    <!-- Dynamic Notification Bell Menu -->
                    <div class="dropdown me-2">
                        <button class="btn btn-light rounded-circle border p-2 position-relative" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fa-solid fa-bell"></i>
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger border border-white" style="font-size: 0.65rem;" th:if="${not #lists.isEmpty(notifications)}" th:text="${#lists.size(notifications)}">
                                3
                            </span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow-lg py-2 border-0" style="width: 320px; border-radius: 1rem; max-height: 400px; overflow-y: auto;">
                            <li class="px-3 py-2 border-bottom d-flex justify-content-between align-items-center">
                                <span class="fw-bold text-dark">Notifications Log</span>
                                <span class="badge bg-indigo bg-opacity-10 text-primary small" th:text="${#lists.size(notifications)} + ' total'">3 total</span>
                            </li>
                            <li th:each="log : ${notifications}" class="px-3 py-2.5 border-bottom border-light">
                                <div class="d-flex align-items-start gap-2">
                                    <div class="mt-1 text-primary" style="font-size: 0.85rem;"><i class="fa-solid fa-circle-info"></i></div>
                                    <div>
                                        <p class="mb-0 text-dark small fw-semibold" th:text="${log.details}">Activity details</p>
                                        <small class="text-muted" th:text="${#temporals.format(log.createdAt, 'yyyy-MM-dd HH:mm')}">Time</small>
                                    </div>
                                </div>
                            </li>
                            <li th:if="${#lists.isEmpty(notifications)}" class="px-3 py-4 text-center text-muted small">
                                <i class="fa-solid fa-bell-slash d-block fa-2x mb-2 opacity-40"></i>
                                No notification activities logged yet.
                            </li>
                        </ul>
                    </div>

                    <!-- Profile Gear menu -->
                    <div class="dropdown">
                        <button class="btn btn-light rounded-circle border p-2" type="button" data-bs-toggle="dropdown">
                            <i class="fa-solid fa-user"></i>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                            <li><a class="dropdown-menu-item dropdown-item" href="#"><i class="fa-solid fa-gear me-2"></i>Settings</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-menu-item dropdown-item text-danger" href="#"><i class="fa-solid fa-right-from-bracket me-2"></i>Logout</a></li>
                        </ul>
                    </div>
                </div>
            </header>

            <!-- Page Main Content -->
            <main class="p-4 flex-grow-1">
                <!-- Success Alert Flash Message -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                    <i class="fa-solid fa-circle-check me-2"></i>
                    <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Error Alert Flash Message -->
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                    <i class="fa-solid fa-circle-exclamation me-2"></i>
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div th:replace="${content}"></div>
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
