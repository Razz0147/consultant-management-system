<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Consultant Profile', ~{::div.view-container})}">
<body>
<div class="view-container">

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="content-card">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary border-opacity-10">
                    <div class="d-flex align-items-center gap-3">
                        <div class="stat-icon-wrapper stat-icon-primary" style="width: 56px; height: 56px; font-size: 1.6rem;">
                            <i class="fa-solid fa-user-tie"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold mb-1 text-dark" th:text="${consultant.name}">Consultant Name</h4>
                            <span th:class="${consultant.status == 'Active' ? 'badge-status-active' : 'badge-status-inactive'}"
                                  th:text="${consultant.status}">Active</span>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <a th:href="@{/consultants/edit/{id}(id=${consultant.id})}" class="btn btn-primary btn-sm px-3">
                            <i class="fa-solid fa-pen me-1"></i> Edit Profile
                        </a>
                        <a th:href="@{/consultants}" class="btn btn-outline-secondary btn-sm px-3">
                            <i class="fa-solid fa-arrow-left me-1"></i> Back
                        </a>
                    </div>
                </div>

                <div class="row g-4">
                    <!-- Email -->
                    <div class="col-md-6">
                        <div class="p-3 rounded border border-secondary border-opacity-10 bg-white bg-opacity-30">
                            <small class="text-muted text-uppercase fw-bold d-block mb-1.5 small" style="font-size: 0.725rem; letter-spacing: 0.05em;">Email Address</small>
                            <span class="fs-6 text-dark fw-semibold" th:text="${consultant.email}">email@example.com</span>
                        </div>
                    </div>
                    <!-- Phone -->
                    <div class="col-md-6">
                        <div class="p-3 rounded border border-secondary border-opacity-10 bg-white bg-opacity-30">
                            <small class="text-muted text-uppercase fw-bold d-block mb-1.5 small" style="font-size: 0.725rem; letter-spacing: 0.05em;">Phone Number</small>
                            <span class="fs-6 text-dark fw-semibold" th:text="${consultant.phone}">+1 555-0100</span>
                        </div>
                    </div>
                    <!-- Experience -->
                    <div class="col-md-6">
                        <div class="p-3 rounded border border-secondary border-opacity-10 bg-white bg-opacity-30">
                            <small class="text-muted text-uppercase fw-bold d-block mb-1.5 small" style="font-size: 0.725rem; letter-spacing: 0.05em;">Experience</small>
                            <span class="fs-5 fw-bold text-primary" th:text="${consultant.experience} + ' Years'">5 Years</span>
                        </div>
                    </div>
                    <!-- ID -->
                    <div class="col-md-6">
                        <div class="p-3 rounded border border-secondary border-opacity-10 bg-white bg-opacity-30">
                            <small class="text-muted text-uppercase fw-bold d-block mb-1.5 small" style="font-size: 0.725rem; letter-spacing: 0.05em;">Consultant ID</small>
                            <span class="fs-6 text-dark fw-semibold" th:text="'CMS-' + ${consultant.id}">CMS-1</span>
                        </div>
                    </div>
                    <!-- Tech Stack -->
                    <div class="col-12">
                        <div class="p-3 rounded border border-secondary border-opacity-10 bg-white bg-opacity-30">
                            <small class="text-muted text-uppercase fw-bold d-block mb-2 small" style="font-size: 0.725rem; letter-spacing: 0.05em;">Technology Stack</small>
                            <div class="d-flex flex-wrap gap-1.5">
                                <span th:each="tech : ${#strings.arraySplit(consultant.technology, ',')}" 
                                      class="tech-badge px-3 py-1.5 fs-6" 
                                      th:text="${#strings.trim(tech)}">Java</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

</div>
</body>
</html>
