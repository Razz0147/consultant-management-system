<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('All Consultants', ~{::div.list-container})}">
<body>
<div class="list-container">

    <div class="content-card">
        <!-- Search and Filter Bar -->
        <form th:action="@{/consultants}" method="get" class="row g-3 mb-4 align-items-center">
            <div class="col-md-5">
                <div class="input-group">
                    <span class="input-group-text bg-white bg-opacity-30 text-muted border-end-0"><i class="fa-solid fa-magnifying-glass"></i></span>
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control border-start-0 ps-0" placeholder="Search by name or technology...">
                </div>
            </div>
            <div class="col-md-3">
                <select name="status" class="form-select" onchange="this.form.submit()">
                    <option value="" th:selected="${status == ''}">All Statuses</option>
                    <option value="Available" th:selected="${status == 'Available'}">Available</option>
                    <option value="On Project" th:selected="${status == 'On Project'}">On Project</option>
                    <option value="Inactive" th:selected="${status == 'Inactive'}">Inactive</option>
                </select>
            </div>
            <div class="col-md-4 text-end d-flex gap-2 justify-content-end">
                <button type="submit" class="btn btn-primary px-3">
                    <i class="fa-solid fa-filter me-1"></i> Filter
                </button>
                <a th:href="@{/consultants}" class="btn btn-light border px-3">Clear</a>
                <!-- Role constraint: Administrator & Manager can Add -->
                <a th:if="${currentRole == 'Administrator' or currentRole == 'Manager'}" th:href="@{/consultants/add}" class="btn btn-success px-3">
                    <i class="fa-solid fa-user-plus me-1"></i> Add New
                </a>
            </div>
        </form>

        <!-- Responsive Table -->
        <div class="table-responsive">
            <table class="table custom-table align-middle mb-0">
                <thead>
                    <tr>
                        <th>
                            <a th:href="@{/consultants(page=${currentPage}, size=${pageSize}, keyword=${keyword}, status=${status}, sortField='id', sortDir=${sortField == 'id' ? reverseSortDir : 'asc'})}" class="text-decoration-none text-dark d-flex align-items-center gap-1.5">
                                ID <i class="fa-solid fa-sort small opacity-60"></i>
                            </a>
                        </th>
                        <th>
                            <a th:href="@{/consultants(page=${currentPage}, size=${pageSize}, keyword=${keyword}, status=${status}, sortField='name', sortDir=${sortField == 'name' ? reverseSortDir : 'asc'})}" class="text-decoration-none text-dark d-flex align-items-center gap-1.5">
                                Name <i class="fa-solid fa-sort small opacity-60"></i>
                            </a>
                        </th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Technology</th>
                        <th>
                            <a th:href="@{/consultants(page=${currentPage}, size=${pageSize}, keyword=${keyword}, status=${status}, sortField='experience', sortDir=${sortField == 'experience' ? reverseSortDir : 'asc'})}" class="text-decoration-none text-dark d-flex align-items-center gap-1.5">
                                Experience <i class="fa-solid fa-sort small opacity-60"></i>
                            </a>
                        </th>
                        <th>Status</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="consultant : ${consultants}">
                        <td class="fw-bold text-muted" th:text="${'CMS-' + consultant.id}">CMS-1</td>
                        <td>
                            <div class="d-flex align-items-center gap-2.5">
                                <div class="rounded-circle bg-primary bg-opacity-10 text-primary d-flex align-items-center justify-content-center fw-bold" 
                                     style="width: 36px; height: 36px; border: 1px solid rgba(99,102,241,0.25);"
                                     th:text="${#strings.substring(consultant.name, 0, 1)}">J</div>
                                <div>
                                    <span class="fw-bold text-dark d-block" th:text="${consultant.name}">John Doe</span>
                                </div>
                            </div>
                        </td>
                        <td class="text-muted" th:text="${consultant.email}">john.doe@email.com</td>
                        <td class="text-muted" th:text="${consultant.phone}">+1 555-0101</td>
                        <td>
                            <span class="tech-badge" th:text="${consultant.technology}">Java</span>
                        </td>
                        <td class="fw-semibold text-dark" th:text="${consultant.experience} + ' yrs'">5 yrs</td>
                        <td>
                            <span th:class="${consultant.status == 'Available' ? 'badge-status-active' : (consultant.status == 'On Project' ? 'badge-status-active bg-primary bg-opacity-10 text-primary border-primary border-opacity-25' : 'badge-status-inactive')}"
                                  th:text="${consultant.status}">Active</span>
                        </td>
                        <td class="text-end">
                            <div class="d-inline-flex gap-1">
                                <a th:href="@{/consultants/view/{id}(id=${consultant.id})}" class="btn btn-sm action-btn btn-outline-info" title="View Details">
                                    <i class="fa-solid fa-eye"></i>
                                </a>
                                <!-- Role constraint: Admins and Managers can edit -->
                                <a th:if="${currentRole == 'Administrator' or currentRole == 'Manager'}" th:href="@{/consultants/edit/{id}(id=${consultant.id})}" class="btn btn-sm action-btn btn-outline-primary" title="Edit">
                                    <i class="fa-solid fa-pen"></i>
                                </a>
                                <!-- Role constraint: Only Admin can delete -->
                                <button th:if="${currentRole == 'Administrator'}" type="button" class="btn btn-sm action-btn btn-outline-danger delete-btn" 
                                        th:data-id="${consultant.id}" th:data-name="${consultant.name}" title="Delete">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(consultants)}">
                        <td colspan="8" class="text-center py-5 text-muted">
                            <i class="fa-solid fa-user-slash fa-2x mb-3 d-block opacity-40"></i>
                            No consultants found matching your criteria.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination Controls -->
        <div th:if="${totalPages > 1}" class="d-flex justify-content-between align-items-center mt-4">
            <div class="text-muted small fw-semibold">
                Showing Page <span class="text-dark" th:text="${currentPage + 1}"></span> of <span class="text-dark" th:text="${totalPages}"></span> 
                (<span th:text="${totalItems}"></span> total entries)
            </div>
            <nav aria-label="Page navigation">
                <ul class="pagination pagination-sm mb-0">
                    <!-- Previous Page -->
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/consultants(page=${currentPage - 1}, size=${pageSize}, keyword=${keyword}, status=${status}, sortField=${sortField}, sortDir=${sortDir})}">Previous</a>
                    </li>
                    <!-- Page Numbers -->
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/consultants(page=${i}, size=${pageSize}, keyword=${keyword}, status=${status}, sortField=${sortField}, sortDir=${sortDir})}" th:text="${i + 1}">1</a>
                    </li>
                    <!-- Next Page -->
                    <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{/consultants(page=${currentPage + 1}, size=${pageSize}, keyword=${keyword}, status=${status}, sortField=${sortField}, sortDir=${sortDir})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>



    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const deleteButtons = document.querySelectorAll(".delete-btn");
            const deleteModal = new bootstrap.Modal(document.getElementById("deleteModal"));
            const confirmDeleteBtn = document.getElementById("confirmDeleteBtn");
            const deleteConsultantName = document.getElementById("deleteConsultantName");

            deleteButtons.forEach(btn => {
                btn.addEventListener("click", function() {
                    const id = this.getAttribute("data-id");
                    const name = this.getAttribute("data-name");
                    deleteConsultantName.textContent = name;
                    confirmDeleteBtn.setAttribute("href", "/consultants/delete/" + id);
                    deleteModal.show();
                });
            });
        });
    </script>
</div>
</body>
</html>
