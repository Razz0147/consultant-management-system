# Application Configuration
spring.application.name=Consultant Management System
server.port=8080

# Database Configuration (Defaults to H2 for instant execution; MySQL config provided below)
# H2 Connection Settings (Active by default for seamless setup)
spring.datasource.url=jdbc:h2:mem:consultant_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Uncomment to switch to MySQL Database
# spring.datasource.url=jdbc:mysql://localhost:3306/consultant_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root

# H2 Console Settings
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# SQL Script Seeding Configuration
spring.sql.init.mode=always

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
