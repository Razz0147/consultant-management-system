version: '3.8'

services:
  mysqldb:
    image: mysql:8.4
    container_name: mysql-consultant-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: consultant_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./consultant_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cms-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  cms-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: consultant-management-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/consultant_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      - cms-network

networks:
  cms-network:
    driver: bridge

volumes:
  db_data:
